name: Apply Homika Pro Patch Auto

on:
  push:
    branches:
      - main
    paths:
      - 'Homika-Pro-*.zip'
      - 'HOMIKA-Pro-*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homika-pro-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find patch ZIP
        id: patch
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(
            find . -maxdepth 1 -type f \
              \( -name 'Homika-Pro-*.zip' -o -name 'HOMIKA-Pro-*.zip' \) \
              -printf '%f\n' |
            sort -V |
            tail -n1
          )"

          if [[ -z "${ZIP:-}" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "has_patch=false" >> "$GITHUB_OUTPUT"
              echo "zip=" >> "$GITHUB_OUTPUT"
              echo "No patch ZIP found. Manual build-only mode."
              exit 0
            fi

            echo "No Homika-Pro-*.zip patch found in repository root."
            exit 1
          fi

          echo "has_patch=true" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Patch: $ZIP"

      - name: Validate and stage patch
        if: steps.patch.outputs.has_patch == 'true'
        shell: python
        env:
          PATCH_ZIP: ${{ steps.patch.outputs.zip }}
        run: |
          import os
          import pathlib
          import shutil
          import stat
          import tempfile
          import zipfile

          repo = pathlib.Path.cwd().resolve()
          archive = repo / os.environ["PATCH_ZIP"]

          temp_root = pathlib.Path(tempfile.mkdtemp(prefix="homika-pro-patch-"))
          extract_root = temp_root / "extract"
          extract_root.mkdir(parents=True)

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  pure = pathlib.PurePosixPath(name)

                  if name.startswith("/") or ".." in pure.parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  if pure.parts and pure.parts[0] in {".git", ".github"}:
                      raise SystemExit(
                          f"Patch may not modify repository workflow metadata: {name}"
                      )

                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f"Symlink not allowed: {name}")

              zf.extractall(extract_root)

          entries = [p for p in extract_root.iterdir() if p.name != "__MACOSX"]

          if len(entries) == 1 and entries[0].is_dir():
              source_root = entries[0]
          else:
              source_root = extract_root

          delete_manifest = source_root / "DELETE_FILES.txt"
          if delete_manifest.exists():
              for raw in delete_manifest.read_text(encoding="utf-8").splitlines():
                  value = raw.strip()

                  if not value or value.startswith("#"):
                      continue

                  rel = pathlib.PurePosixPath(value)
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"Unsafe delete path: {value}")

                  if rel.parts and rel.parts[0] in {".git", ".github"}:
                      raise SystemExit(
                          f"Patch may not delete workflow metadata: {value}"
                      )

                  target = (repo / pathlib.Path(*rel.parts)).resolve()
                  if repo not in target.parents and target != repo:
                      raise SystemExit(
                          f"Delete path escaped repository: {value}"
                      )

                  if target.is_dir():
                      shutil.rmtree(target)
                      print(f"Deleted directory: {value}")
                  elif target.exists():
                      target.unlink()
                      print(f"Deleted file: {value}")

          for item in source_root.iterdir():
              if item.name in {"DELETE_FILES.txt", "__MACOSX"}:
                  continue

              destination = repo / item.name

              if item.is_dir():
                  shutil.copytree(
                      item,
                      destination,
                      dirs_exist_ok=True,
                      copy_function=shutil.copy2,
                  )
              else:
                  shutil.copy2(item, destination)

          print("Patch staged.")

      - name: Remove patch ZIP from repository
        if: steps.patch.outputs.has_patch == 'true'
        shell: bash
        env:
          PATCH_ZIP: ${{ steps.patch.outputs.zip }}
        run: |
          set -euo pipefail
          rm -f -- "$PATCH_ZIP"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Verify Homika Pro application ID
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -n "${APK:-}" || {
            echo "Debug APK not found."
            exit 1
          }

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$AAPT" || {
            echo "aapt not found."
            exit 1
          }

          BADGING="$("$AAPT" dump badging "$APK" | head -n1)"
          echo "$BADGING"

          echo "$BADGING" | grep -F "package: name='com.homika.app'" >/dev/null || {
            echo "Expected application ID com.homika.app was not found."
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/homika-apk"
          cp "$APK" "$RUNNER_TEMP/homika-apk/Homika-Pro-debug.apk"

          echo "artifact_path=$RUNNER_TEMP/homika-apk/Homika-Pro-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Verified application ID: com.homika.app"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Homika-Pro-Debug-${{ github.run_number }}
          path: ${{ steps.apk.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Commit successful patch
        if: steps.patch.outputs.has_patch == 'true'
        shell: bash
        env:
          PATCH_ZIP: ${{ steps.patch.outputs.zip }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "chore: apply ${PATCH_ZIP}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        shell: bash
        env:
          PATCH_ZIP: ${{ steps.patch.outputs.zip }}
          HAS_PATCH: ${{ steps.patch.outputs.has_patch }}
        run: |
          {
            if [[ "$HAS_PATCH" == "true" ]]; then
              echo "## Homika Pro patch applied"
              echo
              echo "- Patch: ${PATCH_ZIP}"
              echo "- Source committed only after successful verification."
            else
              echo "## Homika Pro APK build"
              echo
              echo "- Manual build-only mode."
              echo "- No source changes were made."
            fi

            echo "- Debug build passed."
            echo "- APK application ID verified as com.homika.app."
            echo "- Debug APK uploaded as Actions Artifact."
            echo "- Artifact retention: 14 days."
          } >> "$GITHUB_STEP_SUMMARY"
