name: Apply Homika Pro Patch Auto

on:
  push:
    branches:
      - main
    paths:
      - 'Homika-Pro-*.zip'
      - 'HOMIKA-Pro-*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homika-pro-patch-release
  cancel-in-progress: false

jobs:
  apply-build-release:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize checkout with latest main
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          git fetch --no-tags origin "${BRANCH}"
          REMOTE_REF="origin/${BRANCH}"

          if git merge-base --is-ancestor HEAD "${REMOTE_REF}"; then
            git merge --ff-only "${REMOTE_REF}"
          elif [[ "$(git rev-parse HEAD)" != "$(git rev-parse "${REMOTE_REF}")" ]]; then
            echo "::error::Local workflow commit is not an ancestor of ${REMOTE_REF}."
            echo "::error::Refusing to overwrite remote history. Re-run from latest main."
            exit 1
          fi

          echo "Checkout synchronized at $(git rev-parse --short HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find patch ZIP
        id: patch
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(
            find . -maxdepth 1 -type f               \( -name 'Homika-Pro-*.zip' -o -name 'HOMIKA-Pro-*.zip' \)               -printf '%f\n' |
            sort -V |
            tail -n1
          )"

          if [[ -z "${ZIP:-}" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "has_patch=false" >> "$GITHUB_OUTPUT"
              echo "zip=" >> "$GITHUB_OUTPUT"
              echo "No patch ZIP found. Manual signed release build mode."
              exit 0
            fi

            echo "No Homika-Pro-*.zip patch found in repository root."
            exit 1
          fi

          echo "has_patch=true" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Patch: $ZIP"

      - name: Validate and stage patch
        if: steps.patch.outputs.has_patch == 'true'
        shell: python
        env:
          PATCH_ZIP: ${{ steps.patch.outputs.zip }}
        run: |
          import os
          import pathlib
          import shutil
          import stat
          import tempfile
          import zipfile

          repo = pathlib.Path.cwd().resolve()
          archive = repo / os.environ["PATCH_ZIP"]

          temp_root = pathlib.Path(tempfile.mkdtemp(prefix="homika-pro-patch-"))
          extract_root = temp_root / "extract"
          extract_root.mkdir(parents=True)

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  pure = pathlib.PurePosixPath(name)

                  if name.startswith("/") or ".." in pure.parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  if pure.parts and pure.parts[0] in {".git", ".github"}:
                      raise SystemExit(
                          f"Patch may not modify repository workflow metadata: {name}"
                      )

                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f"Symlink not allowed: {name}")

              zf.extractall(extract_root)

          entries = [p for p in extract_root.iterdir() if p.name != "__MACOSX"]
          source_root = entries[0] if len(entries) == 1 and entries[0].is_dir() else extract_root

          delete_manifest = source_root / "DELETE_FILES.txt"
          if delete_manifest.exists():
              for raw in delete_manifest.read_text(encoding="utf-8").splitlines():
                  value = raw.strip()
                  if not value or value.startswith("#"):
                      continue

                  rel = pathlib.PurePosixPath(value)
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"Unsafe delete path: {value}")

                  if rel.parts and rel.parts[0] in {".git", ".github"}:
                      raise SystemExit(
                          f"Patch may not delete workflow metadata: {value}"
                      )

                  target = (repo / pathlib.Path(*rel.parts)).resolve()
                  if repo not in target.parents and target != repo:
                      raise SystemExit(f"Delete path escaped repository: {value}")

                  if target.is_dir():
                      shutil.rmtree(target)
                      print(f"Deleted directory: {value}")
                  elif target.exists():
                      target.unlink()
                      print(f"Deleted file: {value}")

          for item in source_root.iterdir():
              if item.name in {"DELETE_FILES.txt", "__MACOSX"}:
                  continue

              destination = repo / item.name
              if item.is_dir():
                  shutil.copytree(
                      item,
                      destination,
                      dirs_exist_ok=True,
                      copy_function=shutil.copy2,
                  )
              else:
                  shutil.copy2(item, destination)

          print("Patch staged.")

      - name: Remove patch ZIP from repository
        if: steps.patch.outputs.has_patch == 'true'
        shell: bash
        env:
          PATCH_ZIP: ${{ steps.patch.outputs.zip }}
        run: |
          set -euo pipefail
          rm -f -- "$PATCH_ZIP"

      - name: Generate Homika release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          VERSION_CODE="$((10000 + GITHUB_RUN_NUMBER))"

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Homika version: $VERSION_NAME ($VERSION_CODE)"

      - name: Prepare patch commit locally
        if: steps.patch.outputs.has_patch == 'true'
        shell: bash
        env:
          PATCH_ZIP: ${{ steps.patch.outputs.zip }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: apply ${PATCH_ZIP} for Homika v${VERSION_NAME}"
          fi

      - name: Decode Homika release keystore
        shell: bash
        env:
          HOMIKA_RELEASE_KEYSTORE_BASE64: ${{ secrets.HOMIKA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "${HOMIKA_RELEASE_KEYSTORE_BASE64:-}" || {
            echo "Missing GitHub secret: HOMIKA_RELEASE_KEYSTORE_BASE64"
            exit 1
          }

          printf '%s' "$HOMIKA_RELEASE_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/homika-release.jks"

      - name: Build signed Homika Pro release APK
        shell: bash
        env:
          HOMIKA_VERSION_NAME: ${{ steps.version.outputs.name }}
          HOMIKA_VERSION_CODE: ${{ steps.version.outputs.code }}
          HOMIKA_KEYSTORE_PATH: ${{ runner.temp }}/homika-release.jks
          HOMIKA_KEYSTORE_PASSWORD: ${{ secrets.HOMIKA_RELEASE_KEYSTORE_PASSWORD }}
          HOMIKA_KEY_ALIAS: homika
          HOMIKA_KEY_PASSWORD: ${{ secrets.HOMIKA_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${HOMIKA_KEYSTORE_PASSWORD:-}" || {
            echo "Missing GitHub secret: HOMIKA_RELEASE_KEYSTORE_PASSWORD"
            exit 1
          }

          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: Push verified patch safely
        if: steps.patch.outputs.has_patch == 'true'
        shell: bash
        env:
          HOMIKA_VERSION_NAME: ${{ steps.version.outputs.name }}
          HOMIKA_VERSION_CODE: ${{ steps.version.outputs.code }}
          HOMIKA_KEYSTORE_PATH: ${{ runner.temp }}/homika-release.jks
          HOMIKA_KEYSTORE_PASSWORD: ${{ secrets.HOMIKA_RELEASE_KEYSTORE_PASSWORD }}
          HOMIKA_KEY_ALIAS: homika
          HOMIKA_KEY_PASSWORD: ${{ secrets.HOMIKA_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"
          REMOTE_REF="origin/${BRANCH}"

          rebuild_after_rebase() {
            echo "Remote main advanced while this workflow was building."
            echo "Rebuilding after rebase so pushed source and APK match."
            rm -rf app/build
            chmod +x gradlew
            ./gradlew assembleRelease --console=plain
          }

          for attempt in 1 2 3; do
            echo "Safe push attempt ${attempt}/3"
            git fetch --no-tags origin "${BRANCH}"

            if ! git merge-base --is-ancestor "${REMOTE_REF}" HEAD; then
              echo "Remote branch has new commits. Rebasing patch onto latest ${BRANCH}."

              if ! git rebase "${REMOTE_REF}"; then
                git rebase --abort || true
                echo "::error::Patch conflicts with newer commits on ${BRANCH}."
                echo "::error::No force push was used."
                exit 1
              fi

              rebuild_after_rebase
            fi

            if git push origin "HEAD:${BRANCH}"; then
              echo "Patch pushed successfully."
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Remote changed again before push completed. Retrying safely."
              sleep 2
            fi
          done

          echo "::error::Could not push after 3 safe attempts because ${BRANCH} kept changing."
          echo "::error::No force push was used. Re-run the workflow."
          exit 1

      - name: Verify and prepare signed APK
        id: apk
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n1)"
          test -n "${APK:-}" || {
            echo "Release APK not found."
            exit 1
          }

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$AAPT" || { echo "aapt not found."; exit 1; }
          test -x "$APKSIGNER" || { echo "apksigner not found."; exit 1; }

          BADGING="$("$AAPT" dump badging "$APK" | head -n1)"
          echo "$BADGING"

          echo "$BADGING" | grep -F "package: name='com.homika.app'" >/dev/null || {
            echo "Expected application ID com.homika.app was not found."
            exit 1
          }

          echo "$BADGING" | grep -F "versionCode='${VERSION_CODE}'" >/dev/null || {
            echo "Expected versionCode ${VERSION_CODE} was not found."
            exit 1
          }

          echo "$BADGING" | grep -F "versionName='${VERSION_NAME}'" >/dev/null || {
            echo "Expected versionName ${VERSION_NAME} was not found."
            exit 1
          }

          RELEASE_DIR="$RUNNER_TEMP/homika-release-output"
          mkdir -p "$RELEASE_DIR"

          OUT="$RELEASE_DIR/Homika-Pro-v${VERSION_NAME}.apk"
          SHA="$OUT.sha256"
          CERT="$RELEASE_DIR/Homika-Pro-v${VERSION_NAME}-certificate.txt"

          cp "$APK" "$OUT"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee "$CERT"

          (
            cd "$RELEASE_DIR"
            sha256sum "$(basename "$OUT")" > "$(basename "$SHA")"
          )

          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Homika-Pro-Release-${{ steps.version.outputs.name }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.sha }}
            ${{ steps.apk.outputs.cert }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.path }}
          SHA: ${{ steps.apk.outputs.sha }}
          CERT: ${{ steps.apk.outputs.cert }}
          HAS_PATCH: ${{ steps.patch.outputs.has_patch }}
          PATCH_ZIP: ${{ steps.patch.outputs.zip }}
        run: |
          set -euo pipefail

          TAG="v${VERSION_NAME}"

          if [[ "$HAS_PATCH" == "true" ]]; then
            NOTES="Automated Homika Pro release ${TAG}. Applied patch: ${PATCH_ZIP}."
          else
            NOTES="Automated Homika Pro signed release ${TAG}."
          fi

          gh release create "$TAG"             "$APK"             "$SHA"             "$CERT"             --target "$(git rev-parse HEAD)"             --title "Homika Pro ${TAG}"             --notes "$NOTES"             --latest

      - name: Summary
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          HAS_PATCH: ${{ steps.patch.outputs.has_patch }}
          PATCH_ZIP: ${{ steps.patch.outputs.zip }}
        run: |
          {
            echo "## Homika Pro signed release"
            echo
            echo "- Version: v${VERSION_NAME} (${VERSION_CODE})"
            echo "- Package: com.homika.app"
            echo "- Signed release APK built with the Homika Pro release key."
            echo "- GitHub Release published for the in-app updater."
            echo "- Signed APK also uploaded as an Actions artifact."
            echo "- Push safety: fetch/rebase/rebuild retry enabled; no force push."
            if [[ "$HAS_PATCH" == "true" ]]; then
              echo "- Applied patch: ${PATCH_ZIP}"
            else
              echo "- Manual release build mode: no source patch applied."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
